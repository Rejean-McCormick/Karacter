<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6f0"><title>Karacter 7.0 — Character Psychology Studio</title><link rel="icon" type="image/svg+xml" href="assets/logo.svg"><link rel="stylesheet" href="src/styles.css"></head><body>
<div class="app"><header class="topbar"><div class="logo"><img src="assets/logo.svg" alt="Karacter logo"><div><strong>Karacter<span>.</span></strong><small id="tagline"></small></div></div><div class="top-controls"><button id="langToggle" class="seg" aria-label="Switch language">FR / EN</button><select id="depth" aria-label="Mode"><option value="explore">Explorer</option><option value="studio">Studio</option></select><button id="backupButton" class="primary">↧ Backup</button><span class="status" id="saveStatus" role="status" aria-live="polite"></span><button type="button" id="retrySave" data-action="save-retry" hidden>Retry save</button></div></header>
<div class="layout"><aside class="sidebar"><div class="sideHead"><h2 id="sideTitle">Characters</h2><span id="charCount"></span></div><button class="primary full" data-action="new">＋ <span data-t="new">New character</span></button><button class="full" data-action="preset-open" data-t="templates">New from template</button><input id="search" type="search" placeholder="Search…"><select id="collectionFilter"></select><div id="characterList" class="characterList"></div><div class="sideFoot" data-t="localWarning"></div></aside>
<main><div class="workspaceHeading"><div><p class="eyebrow">CHARACTER PSYCHOLOGY STUDIO · 7.0</p><h1 id="heading">Create</h1><p class="hint" data-t="freeText"></p></div><nav id="tabs" aria-label="Main navigation"><button data-view="create">Create</button><button data-view="understand">Understand</button><button data-view="simulate">Simulate</button><button data-view="story">Story</button><button data-view="gallery">Gallery</button></nav></div><div id="content"></div></main></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div><dialog id="modal"><div id="modalContent"></div></dialog><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/avif" hidden><input type="file" id="batchFile" accept="image/png,image/jpeg,image/webp,image/avif" multiple hidden><input type="file" id="importFile" accept=".zip,.json,.txt" hidden>
<script defer src="src/seed.js"></script><script defer src="src/core.js"></script><script defer src="src/engine.js"></script><script defer src="src/storage.js"></script><script defer src="src/narrative.js"></script><script defer src="src/batch.js"></script><script defer src="src/presets.js"></script><script defer src="src/txt.js"></script><script defer src="src/i18n.js"></script><script defer src="src/app.js"></script></body></html>
